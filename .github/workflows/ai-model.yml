name: AI model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/ai-model/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ai-model.yml']
  pull_request:
    paths: ['crates/ai-model/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/ai-model.yml']

permissions:
  contents: read

jobs:
  ai-model:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy -p craft-ai-model --all-targets --locked -- -D warnings
      - run: cargo test -p craft-ai-model --locked
      # The model promises to compile for the web.
      - run: cargo check -p craft-ai-model --target wasm32-unknown-unknown --locked
